<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthLens AI - Professional Image Forensics</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6C3BFF',
                        secondary: '#E83E8C',
                        accent: '#00D9FF',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-poppins { font-family: 'Poppins', sans-serif; }
        
        .gradient-text {
            background: linear-gradient(135deg, #6C3BFF 0%, #E83E8C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #6C3BFF 0%, #E83E8C 100%);
        }
        .gradient-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .float-animation { animation: float 6s ease-in-out infinite; }
        
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanning-line { animation: scan 2s ease-in-out infinite; }
        
        .drop-zone {
            border: 3px dashed #6C3BFF;
            transition: all 0.3s ease;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            background: rgba(108, 59, 255, 0.1);
            transform: scale(1.02);
            border-color: #E83E8C;
        }
        
        .image-comparison-slider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #6C3BFF, #E83E8C);
            cursor: ew-resize;
            z-index: 10;
            box-shadow: 0 0 20px rgba(108, 59, 255, 0.8);
        }
        .image-comparison-slider::before {
            content: '↔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6C3BFF;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #6C3BFF; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #5a33d5; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;

        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [currentPage, setCurrentPage] = useState('landing');
            const [theme, setTheme] = useState('light');
            const [isLensOpen, setIsLensOpen] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [investigationData, setInvestigationData] = useState(null);
            const [users] = useState([
                { email: 'admin@truthlens.ai', password: 'TruthLens2026!', name: 'Admin', role: 'owner' }
            ]);
            const [reviews, setReviews] = useState([]);
            const [complaints, setComplaints] = useState([]);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const toggleTheme = () => setTheme(theme === 'light' ? 'dark' : 'light');

            const login = (email, password) => {
                const user = users.find(u => u.email === email && u.password === password);
                if (user) {
                    setCurrentUser(user);
                    setShowAuthModal(false);
                    setCurrentPage(user.role === 'owner' ? 'owner-dashboard' : 'client-dashboard');
                    return true;
                }
                return false;
            };

            const googleLogin = () => {
                setCurrentUser({ email: 'user@gmail.com', name: 'Google User', role: 'client' });
                setShowAuthModal(false);
                setCurrentPage('client-dashboard');
            };

            const logout = () => {
                setCurrentUser(null);
                setCurrentPage('landing');
            };

            const submitReview = (review) => {
                setReviews([...reviews, { ...review, id: Date.now(), date: new Date().toLocaleDateString(), replied: false }]);
            };

            const submitComplaint = (complaint) => {
                setComplaints([...complaints, { ...complaint, id: Date.now(), date: new Date().toLocaleDateString(), status: 'pending', reply: '' }]);
            };

            const replyToComplaint = (id, replyText) => {
                setComplaints(complaints.map(c => c.id === id ? { ...c, reply: replyText, status: 'replied' } : c));
            };

            return (
                <AppContext.Provider value={{
                    currentPage, setCurrentPage,
                    theme, toggleTheme,
                    isLensOpen, setIsLensOpen,
                    currentUser, login, logout, googleLogin,
                    showAuthModal, setShowAuthModal,
                    investigationData, setInvestigationData,
                    reviews, submitReview,
                    complaints, submitComplaint, replyToComplaint
                }}>
                    {children}
                </AppContext.Provider>
            );
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const Button = ({ children, variant = 'primary', size = 'md', className = '', onClick, icon, disabled, type = 'button' }) => {
            const variants = {
                primary: "bg-gradient-to-r from-primary to-secondary text-white hover:shadow-xl hover:scale-105",
                outline: "border-2 border-primary text-primary hover:bg-primary hover:text-white",
                ghost: "hover:bg-gray-100 dark:hover:bg-gray-800",
                google: "bg-white text-gray-700 border-2 border-gray-300 hover:bg-gray-50 hover:shadow-lg"
            };
            const sizes = { sm: "h-10 px-4 text-sm", md: "h-12 px-6", lg: "h-14 px-8 text-lg" };
            return (
                <button type={type} onClick={onClick} disabled={disabled} 
                    className={`inline-flex items-center justify-center rounded-xl font-semibold transition-all transform ${variants[variant]} ${sizes[size]} ${className} disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none`}>
                    {icon && <Icon name={icon} size={18} className="mr-2" />}
                    {children}
                </button>
            );
        };

        const Card = ({ children, className = '', hover = true }) => (
            <div className={`bg-white dark:bg-gray-800 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 ${hover ? 'hover:shadow-2xl hover:-translate-y-1' : ''} transition-all duration-300 ${className}`}>
                {children}
            </div>
        );

        const Badge = ({ children, color = 'primary' }) => {
            const colors = {
                primary: "bg-primary/10 text-primary",
                success: "bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400",
                warning: "bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400",
                danger: "bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400",
                info: "bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400"
            };
            return <span className={`px-3 py-1 rounded-full text-xs font-bold ${colors[color]}`}>{children}</span>;
        };

        const Input = ({ label, type = 'text', placeholder, value, onChange, required }) => (
            <div className="space-y-2">
                <label className="text-sm font-semibold text-gray-700 dark:text-gray-300">{label}{required && <span className="text-red-500">*</span>}</label>
                <input type={type} placeholder={placeholder} required={required}
                    value={value} onChange={onChange}
                    className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 focus:outline-none focus:border-primary transition-colors"
                />
            </div>
        );

        // AUTH MODAL
        const AuthModal = () => {
            const { showAuthModal, setShowAuthModal, login, googleLogin } = useContext(AppContext);
            const [isLogin, setIsLogin] = useState(true);
            const [formData, setFormData] = useState({ email: '', password: '', name: '' });
            const [error, setError] = useState('');

            if (!showAuthModal) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                const success = login(formData.email, formData.password);
                if (!success) setError('Invalid credentials');
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-8 max-w-md w-full relative shadow-2xl">
                        <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full">
                            <Icon name="x" size={20} />
                        </button>
                        
                        <div className="text-center mb-6">
                            <div className="w-20 h-20 gradient-bg rounded-2xl flex items-center justify-center mx-auto mb-4 float-animation">
                                <Icon name="shield" size={40} className="text-white" />
                            </div>
                            <h2 className="text-3xl font-poppins font-bold gradient-text">{isLogin ? 'Welcome Back' : 'Create Account'}</h2>
                            <p className="text-gray-500 mt-2">Access your TruthLens AI account</p>
                        </div>

                        <Button variant="google" className="w-full mb-4" icon="chrome" onClick={googleLogin}>
                            Continue with Google
                        </Button>

                        <div className="relative my-6">
                            <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-200 dark:border-gray-700"></div></div>
                            <div className="relative flex justify-center text-sm"><span className="px-2 bg-white dark:bg-gray-800 text-gray-500">Or continue with email</span></div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (
                                <Input label="Full Name" placeholder="John Doe" value={formData.name} 
                                    onChange={e => setFormData({...formData, name: e.target.value})} required />
                            )}
                            <Input label="Email" type="email" placeholder="you@example.com" value={formData.email} 
                                onChange={e => setFormData({...formData, email: e.target.value})} required />
                            <Input label="Password" type="password" placeholder="••••••••" value={formData.password} 
                                onChange={e => setFormData({...formData, password: e.target.value})} required />
                            
                            {error && <p className="text-red-500 text-sm text-center">{error}</p>}
                            
                            <Button type="submit" className="w-full">{isLogin ? 'Sign In' : 'Sign Up'}</Button>
                        </form>

                        <p className="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
                            {isLogin ? "Don't have an account?" : "Already have an account?"}
                            <button onClick={() => setIsLogin(!isLogin)} className="ml-2 text-primary font-semibold hover:underline">
                                {isLogin ? 'Sign Up' : 'Sign In'}
                            </button>
                        </p>
                    </div>
                </div>
            );
        };

        // NAVBAR
        const Navbar = () => {
            const { currentPage, setCurrentPage, theme, toggleTheme, setIsLensOpen, currentUser, setShowAuthModal, logout } = useContext(AppContext);
            
            const clientLinks = [
                { id: 'landing', label: 'Home', icon: 'home' },
                { id: 'client-dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'compare', label: 'Compare', icon: 'git-compare' },
                { id: 'detect', label: 'AI Detection', icon: 'shield' },
                { id: 'games', label: 'Games', icon: 'gamepad-2' },
                { id: 'reviews', label: 'Reviews', icon: 'star' },
                { id: 'about', label: 'About', icon: 'users' }
            ];

            const ownerLinks = [
                { id: 'owner-dashboard', label: 'Admin Panel', icon: 'shield' },
                { id: 'complaints', label: 'Complaints', icon: 'message-square' },
                { id: 'analytics', label: 'Analytics', icon: 'bar-chart-3' }
            ];

            const links = currentUser?.role === 'owner' ? ownerLinks : clientLinks;

            return (
                <nav className="sticky top-0 z-40 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex items-center justify-between h-16">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setCurrentPage('landing')}>
                                <div className="w-10 h-10 gradient-bg rounded-xl flex items-center justify-center">
                                    <Icon name="eye" size={24} className="text-white" />
                                </div>
                                <div className="flex flex-col">
                                    <span className="font-poppins font-bold text-xl">TruthLens<span className="gradient-text">AI</span></span>
                                </div>
                            </div>

                            <div className="hidden lg:flex items-center space-x-1">
                                {links.map(l => (
                                    <button key={l.id} onClick={() => setCurrentPage(l.id)}
                                        className={`px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 transition-all ${currentPage === l.id ? 'bg-primary/10 text-primary' : 'hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                        <Icon name={l.icon} size={16} />
                                        {l.label}
                                    </button>
                                ))}
                            </div>

                            <div className="flex items-center gap-3">
                                <button onClick={toggleTheme} className="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                                    <Icon name={theme === 'light' ? 'moon' : 'sun'} size={20} />
                                </button>
                                <button onClick={() => setIsLensOpen(true)} className="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 relative transition-colors">
                                    <Icon name="message-square" size={20} />
                                    <span className="absolute -top-1 -right-1 w-3 h-3 bg-green-500 rounded-full border-2 border-white dark:border-gray-900"></span>
                                </button>
                                {currentUser ? (
                                    <div className="flex items-center gap-3">
                                        <div className="hidden md:block text-right">
                                            <div className="text-sm font-semibold">{currentUser.name}</div>
                                            <div className="text-xs text-gray-500 capitalize">{currentUser.role}</div>
                                        </div>
                                        <div className="w-10 h-10 gradient-bg rounded-full flex items-center justify-center text-white font-bold">
                                            {currentUser.name.charAt(0)}
                                        </div>
                                        <Button variant="outline" size="sm" onClick={logout}>Logout</Button>
                                    </div>
                                ) : (
                                    <Button onClick={() => setShowAuthModal(true)} size="sm">Sign In</Button>
                                )}
                            </div>
                        </div>
                    </div>
                </nav>
            );
        };

        // LENS CHATBOT
        const LensChat = () => {
            const { isLensOpen, setIsLensOpen, investigationData } = useContext(AppContext);
            const [messages, setMessages] = useState([
                { id: 1, role: 'assistant', content: "Hi! I'm Lens, your AI investigation assistant. Upload an image and I'll help you analyze it!" }
            ]);
            const [input, setInput] = useState('');
            const chatEndRef = useRef(null);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            const getResponse = (msg) => {
                if (!investigationData) return "Please upload an image first, then I can help analyze it!";
                
                const lower = msg.toLowerCase();
                if (lower.includes('score') || lower.includes('probability')) {
                    return `**AI Probability: ${investigationData.aiProbability}%**\n\nBased on:\n• Texture: ${investigationData.evidence[0].score}%\n• Lighting: ${investigationData.evidence[1].score}%\n• Edges: ${investigationData.evidence[2].score}%\n\nThis is an analytical estimate.`;
                }
                if (lower.includes('difference') || lower.includes('changed')) {
                    return `I detected ${investigationData.differences || 7} key differences including background changes, object positioning, and lighting variations.`;
                }
                return "I can explain the AI score, analyze differences, or provide detailed evidence. What would you like to know?";
            };

            const handleSend = () => {
                if (!input.trim()) return;
                setMessages(prev => [...prev, { id: Date.now(), role: 'user', content: input }]);
                setInput('');
                setTimeout(() => {
                    setMessages(prev => [...prev, { id: Date.now()+1, role: 'assistant', content: getResponse(input) }]);
                }, 1000);
            };

            if (!isLensOpen) return null;

            return (
                <div className="fixed bottom-6 right-6 w-96 h-[600px] bg-white dark:bg-gray-800 rounded-3xl shadow-2xl border-2 border-gray-200 dark:border-gray-700 z-50 flex flex-col overflow-hidden">
                    <div className="p-4 gradient-bg text-white">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-white/20 rounded-xl"><Icon name="sparkles" size={20} /></div>
                                <div>
                                    <h3 className="font-bold">Lens AI Assistant</h3>
                                    <div className="flex items-center gap-1.5 text-xs opacity-90">
                                        <div className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                                        Online
                                    </div>
                                </div>
                            </div>
                            <button onClick={() => setIsLensOpen(false)} className="p-2 hover:bg-white/20 rounded-xl"><Icon name="x" size={18} /></button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50 dark:bg-gray-900">
                        {messages.map(msg => (
                            <div key={msg.id} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm ${msg.role === 'user' ? 'gradient-bg text-white rounded-br-md' : 'bg-white dark:bg-gray-800 rounded-bl-md shadow-md'}`}>
                                    <div className="whitespace-pre-wrap">{msg.content}</div>
                                </div>
                            </div>
                        ))}
                        <div ref={chatEndRef} />
                    </div>

                    <div className="p-3 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
                        <div className="flex gap-2">
                            <input value={input} onChange={e => setInput(e.target.value)} 
                                onKeyDown={e => e.key === 'Enter' && handleSend()}
                                placeholder="Ask about your analysis..." 
                                className="flex-1 px-4 py-2 rounded-xl border-2 border-gray-200 dark:border-gray-700 bg-transparent text-sm focus:outline-none focus:border-primary"
                            />
                            <button onClick={handleSend} className="p-2 gradient-bg text-white rounded-xl hover:shadow-lg">
                                <Icon name="send" size={18} />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const LensButton = () => {
            const { setIsLensOpen } = useContext(AppContext);
            return (
                <button onClick={() => setIsLensOpen(true)} className="fixed bottom-6 right-6 z-40 p-4 gradient-bg text-white rounded-full shadow-2xl hover:scale-110 transition-transform">
                    <Icon name="message-square" size={32} />
                    <span className="absolute -top-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-white animate-pulse"></span>
                </button>
            );
        };

        // LANDING PAGE
        const LandingPage = () => {
            const { setCurrentPage, setShowAuthModal } = useContext(AppContext);

            return (
                <div className="min-h-screen">
                    {/* Hero Section */}
                    <section className="relative gradient-hero pt-20 pb-32 overflow-hidden">
                        <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImdyaWQiIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTSAxMCAwIEwgMCAwIDAgMTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS1vcGFjaXR5PSIwLjEiIHN0cm9rZS13aWR0aD0iMSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNncmlkKSIvPjwvc3ZnPg==')] opacity-20"></div>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
                            <div className="text-center mb-16">
                                <div className="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-white/10 backdrop-blur-md text-white text-sm font-semibold mb-8 border border-white/20">
                                    <Icon name="sparkles" size={18} /> AI-Powered Visual Forensics Platform
                                </div>
                                <h1 className="text-5xl md:text-7xl font-poppins font-bold mb-6 leading-tight text-white">
                                    Detect AI-Generated<br/>Images Instantly
                                </h1>
                                <p className="text-xl text-white/90 max-w-3xl mx-auto mb-10">
                                    Professional-grade image forensics. Compare, analyze, and verify authenticity with 98% accuracy using advanced AI detection.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                    <Button size="lg" onClick={() => setCurrentPage('compare')} icon="search" className="bg-white text-primary hover:bg-gray-100">
                                        Start Investigation
                                    </Button>
                                    <Button size="lg" variant="outline" onClick={() => setCurrentPage('games')} icon="gamepad-2" className="border-white text-white hover:bg-white/10">
                                        Play Games
                                    </Button>
                                </div>
                            </div>

                            {/* Stats */}
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-4xl mx-auto">
                                {[
                                    { value: '98%', label: 'Accuracy' },
                                    { value: '50K+', label: 'Images Analyzed' },
                                    { value: '<2s', label: 'Analysis Time' },
                                    { value: '4.9/5', label: 'User Rating' }
                                ].map((stat, i) => (
                                    <div key={i} className="bg-white/10 backdrop-blur-md rounded-2xl p-6 text-center border border-white/20">
                                        <div className="text-3xl font-bold text-white mb-2">{stat.value}</div>
                                        <div className="text-white/80 text-sm">{stat.label}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Features */}
                    <section className="py-24 bg-white dark:bg-gray-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center mb-16">
                                <h2 className="text-4xl font-poppins font-bold mb-4">Professional Investigation Tools</h2>
                                <p className="text-gray-600 dark:text-gray-400 text-lg">Everything you need to uncover the truth</p>
                            </div>
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {[

        // WORKING COMPARE PAGE
        const ComparePage = () => {
            const [imageA, setImageA] = useState(null);
            const [imageB, setImageB] = useState(null);
            const [sliderPos, setSliderPos] = useState(50);
            const [analyzing, setAnalyzing] = useState(false);
            const [result, setResult] = useState(null);
            const containerRef = useRef(null);

            const handleDrop = (e, slot) => {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    loadImage(file, slot);
                }
            };

            const handleFileSelect = (e, slot) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    loadImage(file, slot);
                }
            };

            const loadImage = (file, slot) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    if (slot === 'A') setImageA(e.target.result);
                    else setImageB(e.target.result);
                };
                reader.readAsDataURL(file);
            };

            const analyze = () => {
                if (!imageA || !imageB) return;
                setAnalyzing(true);
                setTimeout(() => {
                    setResult({
                        similarity: Math.floor(Math.random() * 30) + 70,
                        differences: Math.floor(Math.random() * 10) + 3,
                        aiProbability: Math.floor(Math.random() * 40) + 10,
                        evidence: [
                            { label: 'Texture', score: Math.floor(Math.random() * 30) + 70 },
                            { label: 'Lighting', score: Math.floor(Math.random() * 30) + 70 },
                            { label: 'Edges', score: Math.floor(Math.random() * 30) + 70 }
                        ]
                    });
                    setAnalyzing(false);
                }, 2000);
            };

            const handleMouseMove = (e) => {
                if (!containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
                setSliderPos((x / rect.width) * 100);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-12">
                    <div className="mb-8">
                        <h1 className="text-4xl font-poppins font-bold mb-2">Image Comparison</h1>
                        <p className="text-gray-600 dark:text-gray-400">Upload two images to detect visual differences</p>
                    </div>

                    {!result ? (
                        <div className="grid md:grid-cols-2 gap-6">
                            {['A', 'B'].map(slot => (
                                <Card key={slot} className="p-6" hover={false}>
                                    <h3 className="font-poppins font-bold text-lg mb-4 flex items-center gap-2">
                                        <div className={`w-8 h-8 rounded-lg ${slot === 'A' ? 'bg-blue-500' : 'bg-secondary'} flex items-center justify-center text-white font-bold`}>
                                            {slot}
                                        </div>
                                        {slot === 'A' ? 'Original Image' : 'Modified Image'}

                                    <div 
                                        onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}

                                    >
                                        <input type="file" id={`file-${slot}`} className="hidden" accept="image/*" onChange={(e) => handleFileSelect(e, slot)} />

                                            <img src={slot === 'A' ? imageA : imageB} alt={slot} className="w-full h-full object-contain rounded-xl max-h-[400px]" />
                                        ) : (
                                            <>
                                                <div className="w-20 h-20 gradient-bg rounded-full flex items-center justify-center mb-4">
                                                    <Icon name="upload" size={32} className="text-white" />
                                                </div>
                                                <p className="font-semibold text-lg mb-2">Drop image here or click to upload</p>
                                                <p className="text-sm text-gray-500">Supports: JPG, PNG, WEBP up to 10MB</p>
                                            </>
                                        )}
                                    </div>
                                </Card>
                            ))}
                        </div>
                    ) : (
                        <div className="space-y-6">
                            <Card className="p-6" hover={false}>
                                <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
                                    <Button variant="outline" onClick={() => { setResult(null); setImageA(null); setImageB(null); }}>New Comparison</Button>
                                    <div className="flex gap-6">
                                        <div><span className="text-gray-500">Similarity:</span> <span className="font-bold gradient-text text-xl ml-2">{result.similarity}%</span></div>
                                        <div><span className="text-gray-500">Differences:</span> <span className="font-bold text-xl ml-2">{result.differences}</span></div>
                                    </div>
                                </div>

                                <div ref={containerRef} className="relative aspect-video rounded-2xl overflow-hidden cursor-ew-resize shadow-2xl" onMouseMove={handleMouseMove}>
                                    <img src={imageB} alt="B" className="absolute inset-0 w-full h-full object-cover" />
                                    <div className="absolute inset-0 overflow-hidden" style={{ width: `${sliderPos}%` }}>
                                        <img src={imageA} alt="A" className="absolute inset-0 w-full h-full object-cover" style={{ width: `${100 / (sliderPos / 100)}%` }} />
                                    </div>
                                    <div className="image-comparison-slider" style={{ left: `${sliderPos}%` }} />
                                    <div className="absolute top-4 left-4 px-4 py-2 bg-black/70 text-white rounded-full text-sm font-semibold backdrop-blur-md">Original</div>
                                    <div className="absolute top-4 right-4 px-4 py-2 bg-primary text-white rounded-full text-sm font-semibold backdrop-blur-md">Modified</div>
                                </div>
                            </Card>

                            <Card className="p-6" hover={false}>
                                <h3 className="font-poppins font-bold text-xl mb-6">Analysis Results</h3>
                                <div className="grid md:grid-cols-3 gap-4">
                                    {result.evidence.map((e, i) => (
                                        <div key={i} className="p-5 bg-gray-50 dark:bg-gray-700 rounded-xl">
                                            <div className="flex justify-between items-center mb-3">
                                                <span className="font-semibold">{e.label}</span>
                                                <span className="font-bold text-primary text-lg">{e.score}%</span>
                                            </div>
                                            <div className="h-3 bg-gray-200 dark:bg-gray-600 rounded-full overflow-hidden">
                                                <div className="h-full gradient-bg rounded-full transition-all duration-1000" style={{ width: `${e.score}%` }} />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </Card>
                        </div>
                    )}

                    {imageA && imageB && !result && !analyzing && (
                        <div className="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-30">
                            <Button size="lg" onClick={analyze} icon="scan" className="shadow-2xl">
                                Analyze Images
                            </Button>
                        </div>
                    )}

                    {analyzing && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
                            <Card className="p-12 text-center max-w-md" hover={false}>
                                <div className="w-24 h-24 gradient-bg rounded-full flex items-center justify-center mx-auto mb-6 pulse-glow">
                                    <Icon name="scan" size={40} className="text-white animate-pulse" />
                                </div>
                                <h3 className="text-2xl font-poppins font-bold mb-3">Analyzing Images...</h3>
                                <p className="text-gray-500 mb-6">Detecting differences and patterns</p>
                                <div className="h-3 bg-gray-200 rounded-full overflow-hidden">
                                    <div className="h-full gradient-bg animate-pulse w-full" />
                                </div>
                            </Card>
                        </div>
                    )}
                </div>
            );
        };

        // AI DETECTION PAGE
        const DetectPage = () => {
            const [image, setImage] = useState(null);
            const [analyzing, setAnalyzing] = useState(false);
            const [result, setResult] = useState(null);
            const { setInvestigationData } = useContext(AppContext);

            const handleUpload = (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        setImage(e.target.result);
                        analyzeImage();
                    };
                    reader.readAsDataURL(file);
                }
            };

            const analyzeImage = () => {
                setAnalyzing(true);
                setTimeout(() => {
                    const aiProb = Math.floor(Math.random() * 100);
                    const res = {
                        aiProbability: aiProb,
                        confidence: aiProb > 80 ? 'high' : aiProb > 50 ? 'medium' : 'low',
                        evidence: [
                            { label: 'Texture Analysis', score: Math.floor(Math.random() * 40) + 60 },
                            { label: 'Lighting Analysis', score: Math.floor(Math.random() * 40) + 60 },
                            { label: 'Edge Behavior', score: Math.floor(Math.random() * 40) + 60 },
                            { label: 'Noise Pattern', score: Math.floor(Math.random() * 40) + 60 }
                        ]
                    };
                    setResult(res);
                    setInvestigationData(res);
                    setAnalyzing(false);
                }, 3000);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-12">
                    <div className="mb-8">
                        <h1 className="text-4xl font-poppins font-bold mb-2">AI Detection</h1>
                        <p className="text-gray-600 dark:text-gray-400">Upload an image to detect if it's AI-generated</p>
                    </div>

                    {!image ? (
                        <Card className="p-16 text-center" hover={false}>
                            <div className="w-32 h-32 gradient-bg rounded-full flex items-center justify-center mx-auto mb-8 float-animation">
                                <Icon name="shield" size={64} className="text-white" />
                            </div>
                            <h2 className="text-3xl font-poppins font-bold mb-4">Upload Image for Analysis</h2>
                            <p className="text-gray-500 mb-8 max-w-md mx-auto">Our AI will analyze texture, lighting, edges, and noise patterns to detect AI-generated content</p>
                            <input type="file" accept="image/*" onChange={handleUpload} className="hidden" id="detect-upload" />
                            <Button onClick={() => document.getElementById('detect-upload').click()} icon="upload" size="lg">
                                Choose File
                            </Button>
                        </Card>
                    ) : analyzing ? (
                        <Card className="p-16 text-center" hover={false}>
                            <div className="w-24 h-24 gradient-bg rounded-full flex items-center justify-center mx-auto mb-8 pulse-glow">
                                <Icon name="scan" size={40} className="text-white animate-pulse" />
                            </div>
                            <h2 className="text-3xl font-poppins font-bold mb-4">Analyzing Image...</h2>
                            <p className="text-gray-500 mb-8">Examining texture, lighting, edges, and noise patterns</p>
                            <div className="max-w-md mx-auto h-4 bg-gray-200 rounded-full overflow-hidden">
                                <div className="h-full gradient-bg animate-pulse w-full" />
                            </div>
                        </Card>
                    ) : (
                        <div className="grid lg:grid-cols-2 gap-8">
                            <Card className="p-8" hover={false}>
                                <img src={image} alt="Analyzed" className="w-full rounded-2xl mb-8 shadow-lg" />
                                <div className="text-center">
                                    <div className="relative w-56 h-56 mx-auto mb-6">
                                        <svg className="w-full h-full transform -rotate-90">
                                            <circle cx="112" cy="112" r="100" stroke="currentColor" strokeWidth="20" fill="none" className="text-gray-200 dark:text-gray-700" />
                                            <circle cx="112" cy="112" r="100" stroke="url(#grad)" strokeWidth="20" fill="none" strokeDasharray="628" strokeDashoffset={628 - (628 * result.aiProbability / 100)} strokeLinecap="round" />
                                        </svg>
                                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                                            <span className="text-5xl font-bold gradient-text">{result.aiProbability}%</span>
                                            <span className="text-sm text-gray-500 mt-2 font-medium">AI Probability</span>
                                        </div>
                                    </div>
                                    <Badge color={result.confidence === 'high' ? 'danger' : result.confidence === 'medium' ? 'warning' : 'success'}>
                                        {result.confidence.charAt(0).toUpperCase() + result.confidence.slice(1)} Confidence
                                    </Badge>
                                    <Button className="w-full mt-8" variant="outline" onClick={() => { setImage(null); setResult(null); }} size="lg">
                                        Analyze Another
                                    </Button>
                                </div>
                            </Card>

                            <Card className="p-8" hover={false}>
                                <h3 className="font-poppins font-bold text-2xl mb-8">Evidence Breakdown</h3>
                                <div className="space-y-6">
                                    {result.evidence.map((e, i) => (
                                        <div key={i}>
                                            <div className="flex justify-between items-center mb-3">
                                                <span className="font-semibold text-lg">{e.label}</span>
                                                <span className={`font-bold text-xl ${e.score > 85 ? 'text-red-500' : e.score > 70 ? 'text-yellow-500' : 'text-green-500'}`}>{e.score}%</span>
                                            </div>
                                            <div className="h-4 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                                                <div className={`h-full rounded-full transition-all duration-1000 ${e.score > 85 ? 'bg-red-500' : e.score > 70 ? 'bg-yellow-500' : 'bg-green-500'}`} style={{ width: `${e.score}%` }} />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </Card>
                        </div>
                    )}
                </div>
            );

        // GAMES PAGE
        const GamesPage = () => {
            const [activeGame, setActiveGame] = useState(null);
            const [score, setScore] = useState(0);
            const [gameState, setGameState] = useState({});

            const games = {
                'ai-or-real': {
                    title: 'AI or Real?',
                    desc: 'Guess whether images are AI-generated or real photographs',
                    icon: 'brain',
                    color: 'from-purple-500 to-pink-500',
                    images: [
                        { src: 'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=800', isAI: false, label: 'Real Photo' },
                        { src: 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=800', isAI: true, label: 'AI Generated' },
                        { src: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800', isAI: false, label: 'Real Photo' },
                        { src: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800', isAI: true, label: 'AI Generated' }
                    ]
                },
                'spot-diff': {
                    title: 'Spot the Difference',
                    desc: 'Find 5 differences between two similar images',
                    icon: 'eye',
                    color: 'from-blue-500 to-cyan-500',
                    differences: ['Background color', 'Object position', 'Lighting', 'Shadow', 'Texture']
                }
            };

            const handleGameAnswer = (isAI) => {
                const currentImage = games['ai-or-real'].images[gameState.currentImage || 0];
                if (isAI === currentImage.isAI) {
                    setScore(s => s + 100);
                    alert('Correct! +100 points 🎉');
                } else {
                    alert(`Wrong! This was ${currentImage.isAI ? 'AI Generated' : 'Real Photo'}`);
                }
                
                const next = (gameState.currentImage || 0) + 1;
                if (next >= games['ai-or-real'].images.length) {
                    alert(`Game Over! Final Score: ${score + 100}`);
                    setActiveGame(null);
                    setGameState({});
                } else {
                    setGameState({ ...gameState, currentImage: next });
                }

            if (!activeGame) {
                return (
                    <div className="max-w-7xl mx-auto px-4 py-12">

                            <p className="text-gray-600 dark:text-gray-400">Learn visual forensics through interactive games</p>

                        <div className="grid md:grid-cols-2 gap-8">

                                <Card key={key} className="p-8" onClick={() => { setActiveGame(key); setGameState({ currentImage: 0 }); }}>
                                    <div className={`w-20 h-20 bg-gradient-to-br ${game.color} rounded-2xl flex items-center justify-center mb-6 shadow-lg`}>
                                        <Icon name={game.icon} size={40} className="text-white" />
                                    </div>
                                    <h3 className="font-poppins font-bold text-2xl mb-3">{game.title}</h3>
                                    <p className="text-gray-600 dark:text-gray-400 mb-6">{game.desc}</p>
                                    <Button variant="outline" className="w-full" size="lg">Play Now</Button>
                                </Card>
                            ))}
                        </div>
                    </div>

            return (

                            <p className="text-gray-600 dark:text-gray-400">{game.desc}</p>
                        </div>
                        <div className="flex gap-4">
                            <Badge color="primary" className="text-lg px-4 py-2">Score: {score}</Badge>
                            <Button variant="outline" onClick={() => { setActiveGame(null); setGameState({}); }}>Exit Game</Button>
                        </div>
                    </div>

                    {activeGame === 'ai-or-real' && (
                        <Card className="p-8" hover={false}>

                                        <Button size="lg" onClick={() => handleGameAnswer(true)} className="w-56" variant="outline">
                                            AI Generated
                                        </Button>
                                        <Button size="lg" onClick={() => handleGameAnswer(false)} className="w-56 gradient-bg">
                                            Real Photo

                                </div>

                    )}

                    {activeGame === 'spot-diff' && (
                        <Card className="p-8" hover={false}>
                            <div className="grid md:grid-cols-2 gap-6 mb-8">
                                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800" alt="Original" className="rounded-2xl shadow-lg" />
                                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800" alt="Modified" className="rounded-2xl shadow-lg" />
                            </div>
                            <div className="text-center">
                                <p className="text-lg mb-6 font-medium">Find these differences:</p>
                                <div className="flex flex-wrap justify-center gap-3 mb-8">
                                    {game.differences.map((d, i) => (
                                        <Badge key={i} color="warning" className="text-sm px-4 py-2">{d}</Badge>
                                    ))}
                                </div>
                                <Button onClick={() => setScore(s => s + 50)} size="lg">Found All! (+50 pts)</Button>
                            </div>

        const ReviewsPage = () => {
            const { reviews, submitReview } = useContext(AppContext);
            const [formData, setFormData] = useState({ name: '', email: '', rating: 5, comment: '' });
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                submitReview(formData);
                setSubmitted(true);

            return (
                <div className="max-w-7xl mx-auto px-4 py-12">

                        <p className="text-gray-600 dark:text-gray-400 max-w-2xl mx-auto">See what our users say about TruthLens AI</p>
                    </div>

                                    </div>
                                    <h3 className="text-xl font-bold text-green-600 mb-2">Thank You!</h3>

                                <form onSubmit={handleSubmit} className="space-y-4">

                                        <label className="text-sm font-semibold mb-2 block">Rating</label>

                                        <label className="text-sm font-semibold mb-2 block">Comment</label>

                                        />

                                    <Button type="submit" className="w-full" size="lg">Submit Review</Button>
                                </form>

                    <p className="text-gray-600 dark:text-gray-400 max-w-2xl mx-auto">Meet the team behind the platform</p>

                <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                    <Card className="p-8 text-center" hover={false}>
                        <div className="w-32 h-32 gradient-bg rounded-full flex items-center justify-center mx-auto mb-6">
                            <span className="text-5xl font-bold text-white">EZ</span>
                        </div>
                        <h3 className="text-2xl font-poppins font-bold mb-2">Eman Zahid</h3>
                        <p className="text-primary font-medium mb-4">Lead Designer & Developer</p>
                        <div className="space-y-2 text-gray-600 dark:text-gray-400">
                            <p>• UI/UX Design</p>
                            <p>• Client Dashboard Development</p>

                            <p>• Frontend Architecture</p>

                        <div className="flex justify-center gap-4 mt-6">
                            <a href="#" className="p-3 bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-primary hover:text-white transition-colors">
                                <Icon name="linkedin" size={20} />
                            </a>
                            <a href="#" className="p-3 bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-primary hover:text-white transition-colors">
                                <Icon name="github" size={20} />
                            </a>
                        </div>
                    </Card>

                    <Card className="p-8 text-center" hover={false}>
                        <div className="w-32 h-32 gradient-bg rounded-full flex items-center justify-center mx-auto mb-6">

                        </div>
                        <h3 className="text-2xl font-poppins font-bold mb-2">Zunaira Zahid</h3>
                        <p className="text-primary font-medium mb-4">AI & Backend Developer</p>
                        <div className="space-y-2 text-gray-600 dark:text-gray-400">
                            <p>• Lens AI Chatbot</p>
                            <p>• Admin Dashboard</p>
                            <p>• AI Integration</p>

                        </div>

                            <a href="#" className="p-3 bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-primary hover:text-white transition-colors">

                                <Icon name="github" size={20} />

            );

        const ComplaintsPage = () => {
            const { complaints, replyToComplaint } = useContext(AppContext);
            const [replyingTo, setReplyingTo] = useState(null);
            const [replyText, setReplyText] = useState('');

            const handleReply = (id) => {
                replyToComplaint(id, replyText);
                setReplyingTo(null);
                setReplyText('');
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-12">
                    <div className="mb-8">
                        <h1 className="text-4xl font-poppins font-bold mb-2">User Complaints</h1>
                        <p className="text-gray-600 dark:text-gray-400">Manage and respond to user complaints</p>
                    </div>

                    <div className="space-y-4">
                        {complaints.length === 0 ? (
                            <Card className="p-12 text-center" hover={false}>
                                <Icon name="inbox" size={64} className="mx-auto mb-4 text-gray-400" />
                                <h3 className="text-xl font-bold mb-2">No Complaints Yet</h3>
                                <p className="text-gray-500">All systems running smoothly!</p>
                            </Card>
                        ) : (
                            complaints.map(complaint => (
                                <Card key={complaint.id} className="p-6" hover={false}>
                                    <div className="flex items-start justify-between mb-4">
                                        <div>
                                            <h4 className="font-bold text-lg mb-1">{complaint.subject}</h4>
                                            <p className="text-sm text-gray-500">From: {complaint.name} • {complaint.date}</p>
                                        </div>
                                        <Badge color={complaint.status === 'replied' ? 'success' : 'warning'}>
                                            {complaint.status === 'replied' ? 'Replied' : 'Pending'}
                                        </Badge>
                                    </div>
                                    <p className="text-gray-600 dark:text-gray-400 mb-4 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">{complaint.message}</p>
                                    
                                    {complaint.reply && (
                                        <div className="mb-4 p-4 bg-primary/10 rounded-lg border-l-4 border-primary">
                                            <p className="font-semibold mb-1">Your Reply:</p>
                                            <p className="text-gray-700 dark:text-gray-300">{complaint.reply}</p>
                                        </div>
                                    )}

                                    {!replyingTo && complaint.status === 'pending' && (
                                        <Button onClick={() => setReplyingTo(complaint.id)} size="sm" icon="reply">Reply</Button>
                                    )}

                                    {replyingTo === complaint.id && (
                                        <div className="mt-4">
                                            <textarea placeholder="Type your reply..." rows="3"
                                                value={replyText} onChange={e => setReplyText(e.target.value)}
                                                className="w-full px-4 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 mb-3"
                                            />
                                            <div className="flex gap-3">
                                                <Button onClick={() => handleReply(complaint.id)} size="sm">Send Reply</Button>
                                                <Button variant="outline" onClick={() => { setReplyingTo(null); setReplyText(''); }} size="sm">Cancel</Button>
                                            </div>
                                        </div>
                                    )}
                                </Card>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        // CLIENT DASHBOARD
        const ClientDashboard = () => {
            const { currentUser } = useContext(AppContext);
            return (
                <div className="max-w-7xl mx-auto px-4 py-12">
                    <div className="mb-8">
                        <h1 className="text-4xl font-poppins font-bold mb-2">Welcome back, {currentUser?.name}!</h1>
                        <p className="text-gray-600 dark:text-gray-400">Here's your investigation overview</p>
                    </div>

                    <div className="grid md:grid-cols-4 gap-6 mb-8">
                        {[
                            { label: 'Investigations', value: '47', icon: 'search', color: 'from-blue-500 to-cyan-500' },
                            { label: 'Images Compared', value: '128', icon: 'git-compare', color: 'from-primary to-secondary' },
                            { label: 'AI Detections', value: '34', icon: 'shield', color: 'from-orange-500 to-red-500' },
                            { label: 'Reports', value: '21', icon: 'file-text', color: 'from-green-500 to-emerald-500' }
                        ].map((stat, i) => (
                            <Card key={i} className="p-6" hover={false}>
                                <div className={`w-12 h-12 bg-gradient-to-br ${stat.color} rounded-xl flex items-center justify-center mb-4`}>
                                    <Icon name={stat.icon} size={24} className="text-white" />
                                </div>
                                <div className="text-3xl font-bold gradient-text mb-1">{stat.value}</div>
                                <div className="text-sm text-gray-500">{stat.label}</div>
                            </Card>
                        ))}
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                        <Card className="p-6" hover={false}>
                            <h3 className="font-poppins font-bold text-lg mb-4">Quick Actions</h3>
                            <div className="space-y-3">
                                <Button variant="outline" className="w-full justify-start" icon="git-compare">Compare Images</Button>
                                <Button variant="outline" className="w-full justify-start" icon="shield">AI Detection</Button>
                                <Button variant="outline" className="w-full justify-start" icon="gamepad-2">Play Games</Button>
                            </div>
                        </Card>
                        <Card className="p-6 md:col-span-2" hover={false}>
                            <h3 className="font-poppins font-bold text-lg mb-4">Recent Activity</h3>
                            <div className="space-y-3">
                                {[1,2,3].map(i => (
                                    <div key={i} className="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 gradient-bg rounded-lg flex items-center justify-center">
                                                <Icon name="image" size={20} className="text-white" />
                                            </div>
                                            <div>
                                                <div className="font-medium">Investigation #{i}</div>
                                                <div className="text-sm text-gray-500">Sep {i}, 2026</div>
                                            </div>
                                        </div>
                                        <Badge color="success">Completed</Badge>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        // MAIN APP
        const App = () => {
            const { currentPage, setCurrentPage } = useContext(AppContext);
            
            useEffect(() => { lucide.createIcons(); }, [currentPage]);

            const renderPage = () => {
                switch(currentPage) {
                    case 'landing': return <LandingPage />;
                    case 'client-dashboard': return <ClientDashboard />;
                    case 'compare': return <ComparePage />;
                    case 'detect': return <DetectPage />;
                    case 'games': return <GamesPage />;
                    case 'reviews': return <ReviewsPage />;
                    case 'about': return <AboutPage />;
                    case 'owner-dashboard': return <OwnerDashboard />;
                    case 'complaints': return <ComplaintsPage />;
                    default: return <LandingPage />;
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 dark:bg-gray-900">
                    <Navbar />
                    <main>{renderPage()}</main>

        ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><App /></AppProvider>);
