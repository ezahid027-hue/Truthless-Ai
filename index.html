<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthLens AI - See what changed. Know what's real.</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6C3BFF',
                        secondary: '#E83E8C',
                        deep: '#27154D',
                        lavender: '#F1ECFF',
                        darkbg: '#0A0614',
                        darkcard: '#150E26',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-poppins { font-family: 'Poppins', sans-serif; }
        
        .gradient-text {
            background: linear-gradient(135deg, #6C3BFF 0%, #E83E8C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #6C3BFF 0%, #E83E8C 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass {
            background: rgba(21, 14, 38, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanning-line { animation: scan 2s ease-in-out infinite; }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(108, 59, 255, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(108, 59, 255, 0); }
        }
        .pulse-glow { animation: pulse-glow 2s infinite; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #6C3BFF; border-radius: 10px; }

        .image-comparison-container {
            position: relative;
            overflow: hidden;
        }
        .image-comparison-slider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: #6C3BFF;
            cursor: ew-resize;
            z-index: 10;
        }
        .image-comparison-slider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: #6C3BFF;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(108, 59, 255, 0.5);
        }
        .image-comparison-slider::after {
            content: '↔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
        }
    </style>
</head>
<body class="bg-white dark:bg-darkbg text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;

        // --- CONTEXT & STATE ---
        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [currentPage, setCurrentPage] = useState('landing');
            const [theme, setTheme] = useState('light');
            const [isLensOpen, setIsLensOpen] = useState(false);
            const [isLensExpanded, setIsLensExpanded] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [investigationData, setInvestigationData] = useState(null);
            const [chatHistory, setChatHistory] = useState([]);
            const [lensConfig, setLensConfig] = useState({
                personality: 'professional',
                responseStyle: 'detailed',
                autoSuggest: true
            });
            const [users, setUsers] = useState([]);
            const [analytics, setAnalytics] = useState({
                totalInvestigations: 0,
                activeUsers: 0,
                aiDetections: 0,
                comparisons: 0
            });

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const toggleTheme = () => setTheme(theme === 'light' ? 'dark' : 'light');

            const login = (userData) => {
                setCurrentUser(userData);
                setShowAuthModal(false);
                if (userData.role === 'owner') {
                    setCurrentPage('owner-dashboard');
                } else {
                    setCurrentPage('client-dashboard');
                }
            };

            const logout = () => {
                setCurrentUser(null);
                setCurrentPage('landing');
            };

            const register = (userData) => {
                const newUser = { ...userData, id: Date.now(), role: 'client', createdAt: new Date() };
                setUsers([...users, newUser]);
                login(newUser);
            };

            return (
                <AppContext.Provider value={{
                    currentPage, setCurrentPage,
                    theme, toggleTheme,
                    isLensOpen, setIsLensOpen,
                    isLensExpanded, setIsLensExpanded,
                    currentUser, login, logout, register,
                    showAuthModal, setShowAuthModal,
                    investigationData, setInvestigationData,
                    chatHistory, setChatHistory,
                    lensConfig, setLensConfig,
                    users, setUsers,
                    analytics, setAnalytics
                }}>
                    {children}
                </AppContext.Provider>
            );
        };

        // --- ICONS HELPER ---
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- UI COMPONENTS ---
        const Button = ({ children, variant = 'primary', size = 'md', className = '', onClick, icon, disabled }) => {
            const base = "inline-flex items-center justify-center rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary/50 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "gradient-bg text-white hover:opacity-90 shadow-lg shadow-primary/20",
                outline: "border border-gray-200 dark:border-gray-700 bg-transparent hover:bg-gray-50 dark:hover:bg-gray-800",
                ghost: "bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800",
                secondary: "bg-lavender dark:bg-darkcard text-primary hover:bg-primary/10",
                google: "bg-white text-gray-700 border border-gray-300 hover:bg-gray-50"
            };
            const sizes = { sm: "h-8 px-3 text-sm", md: "h-10 px-5 text-sm", lg: "h-12 px-8 text-base" };
            return (
                <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}>
                    {icon && <Icon name={icon} size={16} className="mr-2" />}
                    {children}
                </button>
            );
        };

        const Card = ({ children, className = '', onClick }) => (
            <div onClick={onClick} className={`bg-white dark:bg-darkcard rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm ${onClick ? 'cursor-pointer hover:shadow-md transition-shadow' : ''} ${className}`}>
                {children}
            </div>
        );

        const Badge = ({ children, color = 'primary' }) => {
            const colors = {
                primary: "bg-primary/10 text-primary",
                secondary: "bg-secondary/10 text-secondary",
                success: "bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400",
                warning: "bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400",
                danger: "bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400"
            };
            return <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium ${colors[color]}`}>{children}</span>;
        };

        const Input = ({ label, type = 'text', placeholder, value, onChange, required }) => (
            <div className="space-y-2">
                {label && <label className="text-sm font-medium text-gray-700 dark:text-gray-300">{label}{required && <span className="text-red-500">*</span>}</label>}
                <input
                    type={type}
                    placeholder={placeholder}
                    value={value}
                    onChange={onChange}
                    required={required}
                    className="w-full px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-darkcard focus:outline-none focus:ring-2 focus:ring-primary/50"
                />
            </div>
        );

        // --- AUTH MODAL ---
        const AuthModal = () => {
            const { showAuthModal, setShowAuthModal, login, register } = useContext(AppContext);
            const [isLogin, setIsLogin] = useState(true);
            const [formData, setFormData] = useState({ email: '', password: '', name: '' });

            if (!showAuthModal) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                if (isLogin) {
                    // Mock login
                    login({ email: formData.email, name: formData.email.split('@')[0], role: 'client' });
                } else {
                    register(formData);
                }
            };

            const handleGoogleLogin = () => {
                // Mock Google login
                login({ email: 'user@gmail.com', name: 'Google User', role: 'client', avatar: 'https://lh3.googleusercontent.com/a/default-user' });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                    <div className="bg-white dark:bg-darkcard rounded-2xl p-8 max-w-md w-full shadow-2xl">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-poppins font-bold">{isLogin ? 'Welcome Back' : 'Create Account'}</h2>
                            <button onClick={() => setShowAuthModal(false)} className="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg">
                                <Icon name="x" size={20} />
                            </button>
                        </div>

                        <Button variant="google" className="w-full mb-4" icon="chrome" onClick={handleGoogleLogin}>
                            Continue with Google
                        </Button>

                        <div className="relative my-6">
                            <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-200 dark:border-gray-700"></div></div>
                            <div className="relative flex justify-center text-sm"><span className="px-2 bg-white dark:bg-darkcard text-gray-500">Or continue with email</span></div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && <Input label="Full Name" placeholder="John Doe" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />}
                            <Input label="Email" type="email" placeholder="you@example.com" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} required />
                            <Input label="Password" type="password" placeholder="••••••••" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} required />
                            
                            <Button type="submit" className="w-full">{isLogin ? 'Sign In' : 'Sign Up'}</Button>
                        </form>

                        <p className="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
                            {isLogin ? "Don't have an account?" : "Already have an account?"}
                            <button onClick={() => setIsLogin(!isLogin)} className="ml-2 text-primary font-medium hover:underline">
                                {isLogin ? 'Sign Up' : 'Sign In'}
                            </button>
                        </p>
                    </div>
                </div>
            );
        };

        // --- LOGO ---
        const Logo = ({ size = 'md', showText = true }) => {
            const s = { sm: 24, md: 32, lg: 48 }[size];
            return (
                <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => window.location.hash = '#landing'}>
                    <svg width={s} height={s} viewBox="0 0 48 48" fill="none">
                        <path d="M24 8C14 8 6 16 6 24C6 32 14 40 24 40C34 40 42 32 42 24C42 16 34 8 24 8Z" stroke="#6C3BFF" strokeWidth="3" fill="url(#grad)" fillOpacity="0.1"/>
                        <circle cx="24" cy="24" r="10" stroke="#6C3BFF" strokeWidth="2.5" fill="url(#grad)"/>
                        <circle cx="24" cy="24" r="5" fill="#27154D"/>
                        <circle cx="26" cy="22" r="2" fill="white" fillOpacity="0.8"/>
                        <path d="M38 12L40 10L42 12L40 14L38 12Z" fill="#E83E8C">
                            <animateTransform attributeName="transform" type="rotate" from="0 40 12" to="360 40 12" dur="3s" repeatCount="indefinite"/>
                        </path>
                        <defs><linearGradient id="grad" x1="6" y1="8" x2="42" y2="40"><stop stopColor="#6C3BFF"/><stop offset="1" stopColor="#E83E8C"/></linearGradient></defs>
                    </svg>
                    {showText && (
                        <div className="flex flex-col">
                            <span className={`font-poppins font-bold ${size === 'lg' ? 'text-2xl' : 'text-lg'} leading-none`}>
                                TruthLens <span className="gradient-text">AI</span>
                            </span>
                            {size === 'lg' && <span className="text-xs text-gray-500 font-inter mt-1">See what changed. Know what's real.</span>}
                        </div>
                    )}
                </div>
            );
        };

        // --- NAVBAR ---
        const Navbar = () => {
            const { currentPage, setCurrentPage, theme, toggleTheme, setIsLensOpen, currentUser, setShowAuthModal, logout } = useContext(AppContext);
            const [mobileOpen, setMobileOpen] = useState(false);
            
            const clientLinks = [
                { id: 'landing', label: 'Home' },
                { id: 'client-dashboard', label: 'Dashboard' },
                { id: 'compare', label: 'Compare' },
                { id: 'detect', label: 'AI Detection' },
                { id: 'analyze', label: 'Analyze' },
                { id: 'games', label: 'Games' },
                { id: 'history', label: 'History' }
            ];

            const ownerLinks = [
                { id: 'owner-dashboard', label: 'Admin Panel' },
                { id: 'analytics', label: 'Analytics' },
                { id: 'users', label: 'Users' },
                { id: 'lens-config', label: 'Lens Config' }
            ];

            const links = currentUser?.role === 'owner' ? ownerLinks : clientLinks;

            return (
                <nav className="sticky top-0 z-40 w-full glass border-b border-gray-200 dark:border-gray-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex items-center justify-between h-16">
                            <Logo size="md" />
                            
                            <div className="hidden md:flex items-center space-x-1">
                                {links.map(l => (
                                    <button key={l.id} onClick={() => setCurrentPage(l.id)}
                                        className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${currentPage === l.id ? 'bg-primary/10 text-primary' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'}`}>
                                        {l.label}
                                    </button>
                                ))}
                            </div>

                            <div className="hidden md:flex items-center gap-3">
                                <button onClick={toggleTheme} className="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
                                    <Icon name={theme === 'light' ? 'moon' : 'sun'} size={20} />
                                </button>
                                <button onClick={() => setIsLensOpen(true)} className="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 relative">
                                    <Icon name="message-square" size={20} />
                                    <span className="absolute top-1 right-1 w-2 h-2 bg-secondary rounded-full animate-pulse"></span>
                                </button>
                                {currentUser ? (
                                    <div className="flex items-center gap-3">
                                        <div className="text-right">
                                            <div className="text-sm font-medium">{currentUser.name}</div>
                                            <div className="text-xs text-gray-500 capitalize">{currentUser.role}</div>
                                        </div>
                                        <Button variant="outline" size="sm" onClick={logout}>Logout</Button>
                                    </div>
                                ) : (
                                    <Button onClick={() => setShowAuthModal(true)} icon="user">Sign In</Button>
                                )}
                            </div>

                            <button onClick={() => setMobileOpen(!mobileOpen)} className="md:hidden p-2">
                                <Icon name={mobileOpen ? 'x' : 'menu'} size={24} />
                            </button>
                        </div>
                    </div>
                    {mobileOpen && (
                        <div className="md:hidden border-t border-gray-200 dark:border-gray-800 p-4 space-y-2 bg-white dark:bg-darkbg">
                            {links.map(l => (
                                <button key={l.id} onClick={() => { setCurrentPage(l.id); setMobileOpen(false); }}
                                    className="block w-full text-left px-4 py-3 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800">
                                    {l.label}
                                </button>
                            ))}
                            {currentUser ? (
                                <Button className="w-full mt-4" variant="outline" onClick={logout}>Logout</Button>
                            ) : (
                                <Button className="w-full mt-4" onClick={() => { setShowAuthModal(true); setMobileOpen(false); }}>Sign In</Button>
                            )}
                        </div>
                    )}
                </nav>
            );
        };

        // --- LENS CHATBOT (VISIBLE & PROMINENT) ---
        const LensChat = () => {
            const { isLensOpen, setIsLensOpen, isLensExpanded, setIsLensExpanded, currentPage, investigationData, lensConfig } = useContext(AppContext);
            const [messages, setMessages] = useState([
                { id: 1, role: 'assistant', content: "Hi, I'm Lens — your visual investigation copilot. I'm here to help you analyze images, detect AI content, and uncover the truth. What would you like to investigate today?", mode: 'explain' }
            ]);
            const [input, setInput] = useState('');
            const [mode, setMode] = useState('explain');
            const [isTyping, setIsTyping] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, isTyping]);

            const getLensResponse = (msg) => {
                const lower = msg.toLowerCase();
                if (lower.includes('what changed') || lower.includes('difference')) return "I found 7 notable visual differences:\n\n1. **Background** - Structure changed significantly\n2. **Object Position** - Main object repositioned\n3. **Color** - Temperature increased by 15%\n4. **Lighting** - Shadow patterns inconsistent\n5. **Texture** - Quality differs in key areas\n6. **Edges** - Sharpness varies\n7. **Contrast** - Overall contrast increased\n\nThe background shows the strongest change.";
                if (lower.includes('ai probability') || lower.includes('score')) return "The model estimates an **87% probability** of AI generation.\n\nBased on:\n• Texture Analysis (84%)\n• Lighting Analysis (91%)\n• Edge Behavior (79%)\n• Noise Pattern (76%)\n\n*Note: This is an analytical estimate, not absolute proof.*";
                if (lower.includes('suspicious') || lower.includes('investigate')) return "Three areas deserve inspection:\n\n1. **Background** - Inconsistent texture\n2. **Face Area** - Unusual edge behavior\n3. **Shadow Region** - Lighting inconsistency\n\nWould you like me to highlight these?";
                if (lower.includes('report') || lower.includes('summarize')) return "**Investigation Summary**\n\nAuthenticity: 72/100\nAI Probability: 87%\nDifferences: 7\n\n**Key Evidence:** Texture inconsistency, lighting variation, edge artifacts.\n\n**Assessment:** Image may have undergone AI generation. Further verification recommended.";
                if (lower.includes('challenge')) return "**Counter-Evidence Scan Complete**\n\nSupporting AI generation: 3\nContradicting AI generation: 2\nUncertain: 1\n\n**Revised Probability:** 78% (Medium Confidence)\n\nThe second analysis found natural lighting relationships that weaken the original assessment.";
                if (lower.includes('game') || lower.includes('play')) return "We have exciting games! Try our **Image Puzzle Challenge** where you spot the AI-generated differences, or **Forensic Detective** where you solve visual mysteries. Check out the Games tab!";
                return "I can help analyze visual differences, explain AI detection results, investigate suspicious areas, or generate reports. Try asking: 'What changed?', 'Explain the AI score', 'Challenge this result', or 'Tell me about games'.";
            };

            const handleSend = (text) => {
                if (!text.trim()) return;
                const userMsg = { id: Date.now(), role: 'user', content: text, mode };
                setMessages(prev => [...prev, userMsg]);
                setInput('');
                setIsTyping(true);
                setTimeout(() => {
                    setMessages(prev => [...prev, { id: Date.now()+1, role: 'assistant', content: getLensResponse(text), mode }]);
                    setIsTyping(false);
                }, 1200);
            };

            if (!isLensOpen) return null;

            const contextLabel = { landing: 'Dashboard', dashboard: 'Dashboard', compare: 'Image Comparison', detect: 'AI Detection', analyze: 'Image Analysis', games: 'Games', history: 'History', 'client-dashboard': 'Client Dashboard', 'owner-dashboard': 'Owner Dashboard' }[currentPage] || 'General';

            return (
                <div className={`fixed z-50 ${isLensExpanded ? 'inset-4 md:inset-10' : 'bottom-24 right-6 w-[380px] h-[600px] max-h-[80vh]'} flex flex-col bg-white dark:bg-darkcard rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-800 overflow-hidden transition-all duration-300`}>
                    {/* Header */}
                    <div className="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-800 bg-gradient-to-r from-primary/10 to-secondary/10">
                        <div className="flex items-center gap-3">
                            <div className="p-2 rounded-lg gradient-bg"><Icon name="sparkles" size={16} className="text-white" /></div>
                            <div>
                                <h3 className="font-poppins font-semibold text-sm">Lens AI Assistant</h3>
                                <div className="flex items-center gap-1.5"><div className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div><span className="text-[10px] text-gray-500">Online • {contextLabel}</span></div>
                            </div>
                        </div>
                        <div className="flex gap-1">
                            <button onClick={() => setIsLensExpanded(!isLensExpanded)} className="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700"><Icon name={isLensExpanded ? 'minimize-2' : 'maximize-2'} size={14} /></button>
                            <button onClick={() => setIsLensOpen(false)} className="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700"><Icon name="x" size={14} /></button>
                        </div>
                    </div>

                    {/* Modes */}
                    <div className="flex gap-1 p-2 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-black/20">
                        {['explain', 'investigate', 'compare', 'report'].map(m => (
                            <button key={m} onClick={() => setMode(m)} className={`flex-1 py-1.5 rounded-md text-[11px] font-medium capitalize transition-colors ${mode === m ? 'bg-primary text-white' : 'text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800'}`}>{m}</button>
                        ))}
                    </div>

                    {/* Messages */}
                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {messages.map(msg => (
                            <div key={msg.id} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm ${msg.role === 'user' ? 'bg-primary text-white rounded-br-md' : 'bg-gray-100 dark:bg-gray-800 rounded-bl-md'}`}>
                                    <div className="whitespace-pre-wrap leading-relaxed">{msg.content}</div>
                                </div>
                            </div>
                        ))}
                        {isTyping && (
                            <div className="flex items-center gap-2 text-gray-500 text-xs">
                                <div className="p-1.5 rounded-lg bg-primary/10"><Icon name="scan" size={12} className="text-primary animate-pulse" /></div>
                                <span>Lens is analyzing evidence...</span>
                            </div>
                        )}
                        <div ref={chatEndRef} />
                    </div>

                    {/* Suggested */}

                        <Card className="p-12 text-center">
                            <div className="w-20 h-20 mx-auto mb-6 rounded-full gradient-bg flex items-center justify-center pulse-glow">
                                <Icon name="scan" size={32} className="text-white" />
                            </div>
                            <h2 className="text-xl font-poppins font-semibold mb-2">Analyzing Image...</h2>
                            <p className="text-gray-500">Examining texture, lighting, edges, and noise patterns</p>
                        </Card>
                    ) : (
                        <div className="grid lg:grid-cols-3 gap-6">
                            <Card className="p-8 lg:col-span-1 text-center">
                                <img src={image} alt="Analyzed" className="w-full aspect-square object-cover rounded-xl mb-6" />
                                <div className="relative w-48 h-48 mx-auto mb-6">
                                    <svg className="w-full h-full transform -rotate-90">
                                        <circle cx="96" cy="96" r="88" stroke="currentColor" strokeWidth="12" fill="none" className="text-gray-200 dark:text-gray-800" />
                                        <circle cx="96" cy="96" r="88" stroke="url(#grad)" strokeWidth="12" fill="none" strokeDasharray="552" strokeDashoffset={552 - (552 * result.aiProbability / 100)} strokeLinecap="round" />
                                    </svg>
                                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                                        <span className="text-4xl font-poppins font-bold gradient-text">{result.aiProbability}%</span>
                                        <span className="text-xs text-gray-500 uppercase tracking-wider mt-1">AI Probability</span>
                                    </div>
                                </div>
                                <Badge color={result.confidence === 'high' ? 'danger' : 'warning'}>{result.confidence.charAt(0).toUpperCase() + result.confidence.slice(1)} Confidence</Badge>
                                <Button className="w-full mt-6" variant="outline" icon="refresh-cw" onClick={() => { setImage(null); setResult(null); }}>Analyze Another</Button>
                            </Card>

                            <Card className="p-6 lg:col-span-2">
                                <h3 className="font-poppins font-semibold text-lg mb-6">Visual Evidence Breakdown</h3>
                                <div className="space-y-5">
                                    {result.evidence.map((e, i) => (
                                        <div key={i} className="group">
                                            <div className="flex justify-between items-center mb-2">
                                                <span className="font-medium text-sm">{e.label}</span>
                                                <span className={`text-sm font-bold ${e.score > 85 ? 'text-secondary' : e.score > 70 ? 'text-yellow-500' : 'text-green-500'}`}>{e.score}%</span>
                                            </div>
                                            <div className="h-2 bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden mb-2">
                                                <div className={`h-full rounded-full transition-all duration-1000 ${e.score > 85 ? 'bg-secondary' : e.score > 70 ? 'bg-yellow-500' : 'bg-green-500'}`} style={{width: `${e.score}%`}}></div>
                                            </div>
                                            <p className="text-xs text-gray-500">{e.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </Card>
                        </div>
                    )}
                </div>
            );
        };

        const AnalyzePage = () => {
            const [image, setImage] = useState(null);
            const [analysis, setAnalysis] = useState(null);

            const handleUpload = (file) => {
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        setImage(e.target.result);
                        // Simulate analysis
                        setAnalysis({
                            resolution: '1920x1080',
                            format: file.type,
                            size: (file.size / 1024).toFixed(2) + ' KB',
                            brightness: 72,
                            contrast: 68,
                            sharpness: 85,
                            noise: 'low',
                            metadata: {
                                camera: 'Unknown',
                                date: new Date().toLocaleDateString(),
                                software: 'Adobe Photoshop'
                            }
                        });
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in">
                    <div className="mb-8">
                        <h1 className="text-3xl font-poppins font-bold mb-2">Image Analysis</h1>
                        <p className="text-gray-600 dark:text-gray-400">Deep metadata and quality analysis.</p>
                    </div>

                    {!image ? (
                        <Card className="p-12 text-center">
                            <Icon name="image" size={64} className="mx-auto mb-4 text-gray-400" />
                            <h2 className="text-xl font-poppins font-semibold mb-2">Upload Image to Analyze</h2>
                            <input type="file" accept="image/*" onChange={(e) => handleUpload(e.target.files[0])} className="hidden" id="analyze-upload" />
                            <Button onClick={() => document.getElementById('analyze-upload').click()} icon="upload">Select Image</Button>
                        </Card>
                    ) : (
                        <div className="grid md:grid-cols-2 gap-6">
                            <Card className="p-6">
                                <img src={image} alt="Analyzed" className="w-full rounded-xl mb-4" />
                                <div className="space-y-3">
                                    <div className="flex justify-between"><span className="text-gray-500">Resolution</span><span className="font-medium">{analysis.resolution}</span></div>
                                    <div className="flex justify-between"><span className="text-gray-500">Format</span><span className="font-medium">{analysis.format}</span></div>
                                    <div className="flex justify-between"><span className="text-gray-500">File Size</span><span className="font-medium">{analysis.size}</span></div>
                                    <div className="flex justify-between"><span className="text-gray-500">Noise Level</span><Badge color="success">{analysis.noise}</Badge></div>
                                </div>
                            </Card>

                            <Card className="p-6">
                                <h3 className="font-poppins font-semibold mb-6">Quality Metrics</h3>
                                <div className="space-y-4">
                                    {[
                                        { label: 'Brightness', value: analysis.brightness },
                                        { label: 'Contrast', value: analysis.contrast },
                                        { label: 'Sharpness', value: analysis.sharpness }
                                    ].map((m, i) => (
                                        <div key={i}>
                                            <div className="flex justify-between mb-1">
                                                <span className="text-sm">{m.label}</span>
                                                <span className="text-sm font-medium">{m.value}%</span>
                                            </div>
                                            <div className="h-2 bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden">
                                                <div className="h-full gradient-bg rounded-full" style={{width: `${m.value}%`}}></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </Card>
                        </div>
                    )}
                </div>
            );
        };

        const GamesPage = () => {
            const [activeGame, setActiveGame] = useState(null);
            const [score, setScore] = useState(0);

            const games = [
                { id: 'spot-diff', title: 'Spot the Difference', desc: 'Find AI-generated differences between two images', icon: 'eye', color: 'from-blue-500 to-cyan-500' },
                { id: 'ai-or-real', title: 'AI or Real?', desc: 'Guess whether images are AI-generated or real', icon: 'brain', color: 'from-primary to-secondary' },
                { id: 'forensic', title: 'Forensic Detective', desc: 'Solve visual mysteries and uncover manipulation', icon: 'search', color: 'from-orange-500 to-red-500' },
                { id: 'puzzle', title: 'Image Puzzle', desc: 'Reconstruct images and detect anomalies', icon: 'puzzle', color: 'from-green-500 to-emerald-500' }
            ];

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in">
                    <div className="mb-8">
                        <h1 className="text-3xl font-poppins font-bold mb-2">Games & Challenges</h1>
                        <p className="text-gray-600 dark:text-gray-400">Learn visual forensics through fun interactive games.</p>
                    </div>

                    {!activeGame ? (
                        <div className="grid md:grid-cols-2 gap-6">
                            {games.map(game => (
                                <Card key={game.id} onClick={() => setActiveGame(game.id)} className="p-8 hover:shadow-xl transition-all cursor-pointer group">
                                    <div className={`inline-flex p-4 rounded-2xl bg-gradient-to-br ${game.color} mb-4`}>
                                        <Icon name={game.icon} size={32} className="text-white" />
                                    </div>
                                    <h3 className="text-xl font-poppins font-semibold mb-2">{game.title}</h3>
                                    <p className="text-gray-600 dark:text-gray-400 mb-4">{game.desc}</p>
                                    <Button variant="outline" className="w-full">Play Now</Button>
                                </Card>
                            ))}
                        </div>
                    ) : (
                        <Card className="p-8">
                            <div className="flex items-center justify-between mb-6">
                                <h2 className="text-2xl font-poppins font-bold">{games.find(g => g.id === activeGame).title}</h2>
                                <div className="flex items-center gap-4">
                                    <Badge color="primary">Score: {score}</Badge>
                                    <Button variant="outline" size="sm" onClick={() => setActiveGame(null)}>Exit Game</Button>
                                </div>
                            </div>
                            
                            <div className="aspect-video bg-gray-100 dark:bg-gray-900 rounded-xl flex items-center justify-center">
                                <div className="text-center">
                                    <Icon name={games.find(g => g.id === activeGame).icon} size={64} className="mx-auto mb-4 text-gray-400" />
                                    <p className="text-lg font-medium mb-4">Game Loading...</p>
                                    <Button onClick={() => setScore(s => s + Math.floor(Math.random() * 100))}>Complete Challenge (+Points)</Button>
                                </div>
                            </div>
                        </Card>
                    )}
                </div>
            );
        };

        const HistoryPage = () => {
            const items = [
                { id: 1, title: 'Social Media Image Check', type: 'Detection', score: 87, date: 'Sep 7, 2026', status: 'completed' },
                { id: 2, title: 'Product Ad Review', type: 'Comparison', score: 21, date: 'Sep 6, 2026', status: 'completed' },
                { id: 3, title: 'Profile Photo Analysis', type: 'Analysis', score: 94, date: 'Sep 5, 2026', status: 'completed' },
            ];

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in">
                    <div className="mb-8">
                        <h1 className="text-3xl font-poppins font-bold mb-2">Investigation History</h1>
                        <p className="text-gray-600 dark:text-gray-400">Review your past visual investigations.</p>
                    </div>

                    <Card className="overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-50 dark:bg-black/20 border-b border-gray-200 dark:border-gray-800">
                                    <tr>
                                        <th className="text-left p-4 font-medium text-gray-500">Investigation</th>
                                        <th className="text-left p-4 font-medium text-gray-500">Type</th>
                                        <th className="text-left p-4 font-medium text-gray-500">Score</th>
                                        <th className="text-left p-4 font-medium text-gray-500">Date</th>
                                        <th className="text-left p-4 font-medium text-gray-500">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100 dark:divide-gray-800">
                                    {items.map(item => (
                                        <tr key={item.id} className="hover:bg-gray-50 dark:hover:bg-black/20">
                                            <td className="p-4">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center"><Icon name="image" size={16} className="text-gray-400" /></div>
                                                    <span className="font-medium">{item.title}</span>
                                                </div>
                                            </td>
                                            <td className="p-4"><Badge color={item.type === 'Detection' ? 'secondary' : 'primary'}>{item.type}</Badge></td>
                                            <td className="p-4 font-bold">{item.score}%</td>
                                            <td className="p-4 text-gray-500">{item.date}</td>
                                            <td className="p-4"><Badge color="success">Completed</Badge></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        const OwnerDashboard = () => {
            const { analytics, setAnalytics, users, lensConfig, setLensConfig } = useContext(AppContext);
            const [activeTab, setActiveTab] = useState('overview');

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in">
                    <div className="mb-8">
                        <h1 className="text-3xl font-poppins font-bold mb-2">Owner Dashboard</h1>
                        <p className="text-gray-600 dark:text-gray-400">Manage your TruthLens AI platform.</p>
                    </div>

                    <div className="grid md:grid-cols-4 gap-4 mb-8">
                        {[
                            { label: 'Total Users', value: users.length + 1, icon: 'users', color: 'from-blue-500 to-cyan-500' },
                            { label: 'Investigations', value: analytics.totalInvestigations, icon: 'search', color: 'from-primary to-secondary' },
                            { label: 'AI Detections', value: analytics.aiDetections, icon: 'shield', color: 'from-orange-500 to-red-500' },
                            { label: 'Active Now', value: analytics.activeUsers, icon: 'activity', color: 'from-green-500 to-emerald-500' }
                        ].map((stat, i) => (
                            <Card key={i} className="p-6">
                                <div className={`inline-flex p-3 rounded-xl bg-gradient-to-br ${stat.color} mb-3`}>
                                    <Icon name={stat.icon} size={20} className="text-white" />
                                </div>
                                <div className="text-3xl font-poppins font-bold gradient-text mb-1">{stat.value}</div>
                                <div className="text-sm text-gray-500">{stat.label}</div>
                            </Card>
                        ))}
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                        <Card className="p-6">
                            <h3 className="font-poppins font-semibold mb-4 flex items-center gap-2">
                                <Icon name="sparkles" size={18} className="text-primary" /> Lens Configuration
                            </h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="text-sm font-medium mb-2 block">Personality</label>
                                    <select 
                                        value={lensConfig.personality}
                                        onChange={(e) => setLensConfig({...lensConfig, personality: e.target.value})}
                                        className="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent"
                                    >
                                        <option value="professional">Professional</option>
                                        <option value="friendly">Friendly</option>
                                        <option value="technical">Technical</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="text-sm font-medium mb-2 block">Response Style</label>
                                    <select 
                                        value={lensConfig.responseStyle}
                                        onChange={(e) => setLensConfig({...lensConfig, responseStyle: e.target.value})}
                                        className="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent"
                                    >
                                        <option value="concise">Concise</option>
                                        <option value="detailed">Detailed</option>
                                        <option value="educational">Educational</option>
                                    </select>
                                </div>
                                <div className="flex items-center justify-between">
                                    <span className="text-sm">Auto-suggestions</span>
                                    <button 
                                        onClick={() => setLensConfig({...lensConfig, autoSuggest: !lensConfig.autoSuggest})}
                                        className={`w-12 h-6 rounded-full transition-colors ${lensConfig.autoSuggest ? 'bg-primary' : 'bg-gray-300'}`}
                                    >
                                        <div className={`w-5 h-5 rounded-full bg-white transform transition-transform ${lensConfig.autoSuggest ? 'translate-x-6' : 'translate-x-0.5'}`}></div>
                                    </button>
                                </div>
                                <Button className="w-full" onClick={() => alert('Lens configuration updated!')}>Save Changes</Button>
                            </div>
                        </Card>

                        <Card className="p-6">
                            <h3 className="font-poppins font-semibold mb-4 flex items-center gap-2">
                                <Icon name="users" size={18} className="text-primary" /> Recent Users
                            </h3>
                            <div className="space-y-3">
                                {users.slice(-5).map(user => (
                                    <div key={user.id} className="flex items-center gap-3 p-3 rounded-lg bg-gray-50 dark:bg-black/20">
                                        <div className="w-10 h-10 rounded-full gradient-bg flex items-center justify-center text-white font-bold">
                                            {user.name.charAt(0)}
                                        </div>
                                        <div className="flex-1">
                                            <div className="font-medium text-sm">{user.name}</div>
                                            <div className="text-xs text-gray-500">{user.email}</div>
                                        </div>
                                        <Badge color="success">Active</Badge>
                                    </div>
                                ))}
                                {users.length === 0 && <p className="text-sm text-gray-500 text-center">No users yet</p>}
                            </div>
                        </Card>

                        <Card className="p-6">
                            <h3 className="font-poppins font-semibold mb-4 flex items-center gap-2">
                                <Icon name="settings" size={18} className="text-primary" /> Platform Settings
                            </h3>
                            <div className="space-y-3">
                                <Button variant="outline" className="w-full justify-start" icon="database">Export Data</Button>
                                <Button variant="outline" className="w-full justify-start" icon="mail">Send Announcement</Button>
                                <Button variant="outline" className="w-full justify-start" icon="shield">Moderation Tools</Button>
                                <Button variant="outline" className="w-full justify-start" icon="bar-chart">View Analytics</Button>
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const { currentPage } = useContext(AppContext);
            
            useEffect(() => { lucide.createIcons(); });
            useEffect(() => { lucide.createIcons(); }, [currentPage]);

            const renderPage = () => {
                switch(currentPage) {
                    case 'landing': return <LandingPage />;
                    case 'client-dashboard': return <ClientDashboard />;
                    case 'compare': return <ComparePage />;
                    case 'detect': return <DetectPage />;
                    case 'analyze': return <AnalyzePage />;
                    case 'games': return <GamesPage />;
                    case 'history': return <HistoryPage />;
                    case 'owner-dashboard': return <OwnerDashboard />;
                    default: return <LandingPage />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar />
                    <main className="flex-1">{renderPage()}</main>
                    <footer className="border-t border-gray-200 dark:border-gray-800 py-8 mt-12">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
                            <Logo size="sm" />
                            <div className="text-sm text-gray-500">© 2026 TruthLens AI. Evidence before assumptions.</div>
                            <div className="flex gap-6 text-sm text-gray-500">
                                <a href="#" className="hover:text-primary">Privacy</a>
                                <a href="#" className="hover:text-primary">Terms</a>
                                <a href="#" className="hover:text-primary">Responsible AI</a>
                            </div>
                        </div>
                    </footer>
                    <LensChat />
                    <LensFloatingButton />
                    <AuthModal />
                </div>
            );
        };

        const Root = () => (
            <AppProvider>
                <App />
            </AppProvider>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
    </script>
</body>
</html>
